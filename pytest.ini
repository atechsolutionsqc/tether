[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short summary of failures, verbose output
addopts = -v --tb=short --no-header

# Treat warnings as non-fatal (SQLAlchemy deprecation warnings etc.)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Colours in output
log_cli = false
log_level = WARNING
